name: Daily Illustration Rare Price Update

on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 UTC daily — change to whatever time you want
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run price tracker
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python tracker.py

      - name: Export CSV snapshot
        run: python export_csv.py

      - name: Commit updated database and CSV
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add pokemon_prices.db illustration_rare_price_history.csv
          git diff --quiet --cached || git commit -m "Daily price update: $(date -u +%Y-%m-%d)"
          git push
